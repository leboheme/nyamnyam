plugins {
    id 'com.github.xpenatan.gdx-teavm' version '1.6.2'
}

sourceCompatibility = JavaVersion.VERSION_17
sourceSets.main.java.srcDirs = ["src/"]
sourceSets.main.resources.srcDirs = ["src/main/resources"]

def webAssets = layout.buildDirectory.dir('generated/web-assets')
def webApp = layout.buildDirectory.dir('dist/js/webapp')

tasks.register('prepareWebAssets', Sync) {
    from(rootProject.file('assets')) {
        exclude '**/*.ttf'
        exclude '**/.DS_Store'
    }
    into(webAssets)
}

tasks.register('cleanWebApp', Delete) {
    delete(webApp)
}

gdxTeaVM {
    assets(webAssets)

    js {
        mainClass = 'com.aramirezochoa.nyamnyam.client.HtmlLauncher'
        htmlTitle = 'Nyam Nyam'
        targetFileName = 'nyamnyam.js'
    }
}

tasks.named('generateJavaScript') {
    dependsOn tasks.named('cleanWebApp')
    dependsOn tasks.named('prepareWebAssets')
}

tasks.register('prepareWebRuntime', Sync) {
    dependsOn tasks.named('gdx_teavm_web_js_build')
    from(webApp) {
        exclude 'index.html'
        exclude 'WEB-INF/**'
    }
    into(layout.buildDirectory.dir('web-runtime'))
}
